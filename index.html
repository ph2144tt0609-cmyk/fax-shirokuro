<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FAX白黒</title>
<meta name="description" content="写真をFAX向けの白黒に自動変換（画像はスマホの外に出ません）">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FAX白黒">
<meta name="theme-color" content="#1f6f8b">
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1d2329; --muted: #5b6670;
    --accent: #1f6f8b; --accent-text: #ffffff; --line: #d7dde2; --preview-bg: #e9edf0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181b; --card: #1e2429; --text: #e8edf1; --muted: #9aa6af;
      --accent: #4aa3c2; --accent-text: #0b1114; --line: #333c43; --preview-bg: #2a3137;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.3rem; margin: 4px 0 2px; }
  .lead { color: var(--muted); font-size: .9rem; margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 54px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-text);
    font-size: 1.05rem; font-weight: 700; cursor: pointer; text-decoration: none;
  }
  .btn.sub { background: transparent; color: var(--accent); border: 2px solid var(--accent); min-height: 46px; font-size: .95rem; }
  .btn:disabled { opacity: .45; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row .btn { flex: 1; }
  input[type=file] { display: none; }
  .preview { background: var(--preview-bg); border-radius: 10px; min-height: 160px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .preview img { display: block; max-width: 100%; max-height: 62vh; background: #fff; }
  .preview .empty { color: var(--muted); font-size: .9rem; padding: 24px; text-align: center; }
  label.slider { display: block; font-size: .9rem; margin-top: 12px; }
  label.slider span { color: var(--muted); float: right; }
  input[type=range] { width: 100%; margin-top: 6px; accent-color: var(--accent); }
  .toggle { display: flex; gap: 6px; margin-top: 10px; }
  .toggle button { flex: 1; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: .9rem; }
  .toggle button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .note { color: var(--muted); font-size: .82rem; margin: 8px 2px 0; }
  .status { font-size: .88rem; color: var(--muted); min-height: 1.4em; margin-top: 8px; text-align: center; }
  details { font-size: .88rem; color: var(--muted); }
  details summary { cursor: pointer; color: var(--text); }
  details ol { padding-left: 1.3em; margin: 6px 0; }
</style>
</head>
<body>
<main>
  <h1>FAX白黒</h1>
  <p class="lead">写真を、FAXで黒くつぶれない白黒に自動で直します。画像はこのスマホの中だけで処理され、どこにも送られません。</p>

  <div class="card">
    <label class="btn" for="file">📷 写真を選ぶ</label>
    <input id="file" type="file" accept="image/*">
    <div class="preview" id="preview" style="margin-top:12px">
      <div class="empty">ここに白黒にした画像が出ます</div>
    </div>

    <label class="slider">字の濃さ <span id="kVal">ふつう</span>
      <input id="k" type="range" min="4" max="30" value="14">
    </label>
    <div class="toggle" role="group" aria-label="仕上がり">
      <button type="button" id="modeBw" aria-pressed="true">白黒（FAX向け）</button>
      <button type="button" id="modeGray" aria-pressed="false">グレー（印刷向け）</button>
    </div>
    <div class="row">
      <button class="btn sub" id="rotate" disabled>↻ 回転</button>
      <button class="btn sub" id="save" disabled>保存</button>
    </div>
    <div class="row">
      <button class="btn" id="share" disabled>共有してFAXアプリへ</button>
    </div>
    <div class="status" id="status"></div>
    <p class="note">字がかすれる → つまみを左へ／背景に黒い点が残る → 右へ</p>
  </div>

  <div class="card">
    <details>
      <summary>使い方</summary>
      <ol>
        <li>LINEの画像を長押しして「保存」する</li>
        <li>このページで「写真を選ぶ」</li>
        <li>「共有してFAXアプリへ」→ ポケFAX を選んで送る</li>
      </ol>
      <p>共有に出てこないときは「保存」してから、FAXアプリで写真を選んでください。</p>
      <p>ホーム画面に置くと次から1タップで開けます（Safariの共有ボタン →「ホーム画面に追加」）。</p>
    </details>
  </div>
</main>

<canvas id="work" hidden></canvas>
<script>
(() => {
  const MAX_SIDE = 2200;          // FAXのファイン画質(約200dpi・A4)に足りる大きさ
  const $ = id => document.getElementById(id);
  const fileEl = $('file'), kEl = $('k'), kVal = $('kVal'), preview = $('preview');
  const shareBtn = $('share'), saveBtn = $('save'), rotBtn = $('rotate'), status = $('status');
  const modeBw = $('modeBw'), modeGray = $('modeGray');

  let gray = null, W = 0, H = 0;   // 元画像のグレースケール
  let mode = 'bw';
  let outBlob = null, outUrl = null, baseName = 'fax';

  const kLabel = v => v <= 8 ? '薄め（字を残す）' : v >= 20 ? '濃いめ（背景を消す）' : 'ふつう';

  fileEl.addEventListener('change', async () => {
    const f = fileEl.files && fileEl.files[0];
    if (!f) return;
    baseName = (f.name || 'fax').replace(/\.[^.]+$/, '');
    status.textContent = '読み込み中…';
    try {
      const img = await loadImage(f);
      loadGray(img);
      render();
    } catch (e) {
      status.textContent = 'この画像は読み込めませんでした（' + e.message + '）';
    }
    fileEl.value = '';
  });

  kEl.addEventListener('input', () => { kVal.textContent = kLabel(+kEl.value); });
  kEl.addEventListener('change', () => { if (gray) render(); });
  modeBw.addEventListener('click', () => setMode('bw'));
  modeGray.addEventListener('click', () => setMode('gray'));
  rotBtn.addEventListener('click', () => { if (gray) { rotate90(); render(); } });

  function setMode(m) {
    mode = m;
    modeBw.setAttribute('aria-pressed', m === 'bw');
    modeGray.setAttribute('aria-pressed', m === 'gray');
    kEl.disabled = m !== 'bw';
    if (gray) render();
  }

  function loadImage(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('形式が未対応')); };
      img.src = url;               // 向き(EXIF)はブラウザが自動で反映する
    });
  }

  function loadGray(img) {
    const s = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    W = Math.round(img.naturalWidth * s); H = Math.round(img.naturalHeight * s);
    const c = $('work'); c.width = W; c.height = H;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);
    const d = ctx.getImageData(0, 0, W, H).data;
    gray = new Float32Array(W * H);
    for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
      gray[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
    }
  }

  function rotate90() {
    const g = new Float32Array(W * H), nW = H, nH = W;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      g[x * nW + (nW - 1 - y)] = gray[y * W + x];
    }
    gray = g; W = nW; H = nH;
  }

  // 周囲の明るさとの差で白黒を分ける（影・灰色の背景は白に、字だけ黒に残す）
  function localMean() {
    const r = Math.max(8, Math.round(Math.max(W, H) / 40));
    const iw = W + 1, ii = new Float64Array(iw * (H + 1));
    for (let y = 0; y < H; y++) {
      let row = 0;
      for (let x = 0; x < W; x++) {
        row += gray[y * W + x];
        ii[(y + 1) * iw + x + 1] = ii[y * iw + x + 1] + row;
      }
    }
    const mean = new Float32Array(W * H);
    for (let y = 0; y < H; y++) {
      const y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
      for (let x = 0; x < W; x++) {
        const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1);
        const sum = ii[y1 * iw + x1] - ii[y0 * iw + x1] - ii[y1 * iw + x0] + ii[y0 * iw + x0];
        mean[y * W + x] = sum / ((x1 - x0) * (y1 - y0));
      }
    }
    return mean;
  }

  function render() {
    status.textContent = '変換中…';
    setTimeout(() => {
      const mean = localMean();
      const c = $('work'); c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      const out = ctx.createImageData(W, H), o = out.data;
      const k = +kEl.value / 100;
      for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
        let v;
        if (mode === 'bw') {
          v = gray[i] < mean[i] * (1 - k) ? 0 : 255;
        } else {
          // 背景を白へ持ち上げ、字の濃淡は残す
          v = Math.min(255, Math.max(0, 255 * gray[i] / Math.max(mean[i], 1)));
          v = v > 235 ? 255 : v * 0.9;
        }
        o[p] = o[p + 1] = o[p + 2] = v; o[p + 3] = 255;
      }
      ctx.putImageData(out, 0, 0);
      c.toBlob(b => {
        outBlob = b;
        if (outUrl) URL.revokeObjectURL(outUrl);
        outUrl = URL.createObjectURL(b);
        preview.innerHTML = '';
        const im = new Image(); im.src = outUrl; im.alt = '白黒にした画像';
        preview.appendChild(im);
        shareBtn.disabled = saveBtn.disabled = rotBtn.disabled = false;
        status.textContent = '';
      }, 'image/png');
    }, 30);
  }

  const outFile = () => new File([outBlob], baseName + '_fax.png', { type: 'image/png' });

  shareBtn.addEventListener('click', async () => {
    if (!outBlob) return;
    const f = outFile();
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); }
      catch (e) { if (e.name !== 'AbortError') status.textContent = '共有できませんでした。「保存」を使ってください'; }
    } else {
      status.textContent = 'このブラウザは共有に未対応です。「保存」を使ってください';
    }
  });

  saveBtn.addEventListener('click', () => {
    if (!outBlob) return;
    const a = document.createElement('a');
    a.href = outUrl; a.download = baseName + '_fax.png';
    document.body.appendChild(a); a.click(); a.remove();
    status.textContent = '保存しました（iPhoneは「ファイル」アプリのダウンロードに入ります。写真に入れたいときは画像を長押し→「写真に保存」）';
  });
})();
</script>
</body>
</html>
